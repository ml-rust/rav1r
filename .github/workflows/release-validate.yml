# Reusable tag and version check. release-prepare.yml calls it from the pushed
# tag, and release.yml calls it from the dispatched tag. The two entry points
# share one meaning for a tag.

name: Release Validate

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to validate (a v* tag)"
        required: true
        type: string
    outputs:
      version:
        description: "Tag version without the leading v"
        value: ${{ jobs.validate.outputs.version }}
      is_full_release:
        description: "true when the version carries no prerelease suffix"
        value: ${{ jobs.validate.outputs.is_full_release }}
      base_version:
        description: "Tag version with any prerelease suffix removed: the CHANGELOG heading"
        value: ${{ jobs.validate.outputs.base_version }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate Version Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_full_release: ${{ steps.version.outputs.is_full_release }}
      base_version: ${{ steps.version.outputs.base_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Validate tag against the manifest
        id: version
        env:
          TAG: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#v}"

          CRATE_VERSION=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name == "rav1r") | .version')

          echo "Tag version:      $TAG_VERSION"
          echo "rav1r version: $CRATE_VERSION"

          CARGO_BASE=$(echo "$CRATE_VERSION" | grep -oP '^\d+\.\d+\.\d+')

          if [[ ! "$TAG_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-[a-zA-Z]+\.[0-9]+)?$ ]]; then
            echo "::error::Invalid tag format '$TAG'. Expected: vX.Y.Z or vX.Y.Z-label.N"
            exit 1
          fi

          TAG_BASE="${BASH_REMATCH[1]}"

          if [[ "$TAG_BASE" != "$CARGO_BASE" ]]; then
            echo "::error::Base version mismatch! Tag '$TAG_BASE' != Cargo.toml '$CARGO_BASE'"
            exit 1
          fi

          # Full release = no hyphen suffix (v0.1.0, not v0.1.0-beta.1)
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "is_full_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_full_release=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$TAG_BASE" >> "$GITHUB_OUTPUT"

      # A release needs a changelog entry. This check runs at the tag, before
      # the suite and before any publish, in the validator both entry points
      # share.
      #
      # A prerelease is checked against its base version: `v0.1.0-beta.1` needs
      # the `## [0.1.0]` section, so each beta uses the notes of the final
      # release.
      - name: Require a changelog section
        run: bash scripts/ci/changelog_section.sh "${{ steps.version.outputs.base_version }}"
