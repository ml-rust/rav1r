# Reusable test workflow.
#
# Called by:
#   - ci.yml              (pull requests, master pushes, manual dispatch)
#   - release-prepare.yml (tag gate, before anything is published)
#
# Not triggered directly: `workflow_call` only.
#
# Every third-party action is pinned to a commit SHA, with its release in a
# trailing comment. A tag can move. A SHA cannot, so a retagged action cannot
# enter a run that holds a crates.io token. Dependabot keeps the pins current
# (.github/dependabot.yml).
#
# Jobs:
#   lint     - rustfmt, docs, shellcheck
#   clippy   - `-D warnings` on every feature set the matrix names
#   test     - the test suite with no features and with default features
#   msrv     - the MSRV from Cargo.toml
#   audit    - cargo-deny: advisories, licences, sources, banned crates
#
# The upstream byte-identical gate (tests/upstream_gate.rs) skips here, because
# RAV1R_GATE_DIR is unset. It runs locally: see CONTRIBUTING.md.

name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Format, Docs & Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: lint

      - name: Check formatting
        run: cargo fmt --all --check

      # Warnings are denied: a link to a private item renders as plain text
      # with no report. `asm` and the decode tests stay out, because they need
      # NASM and system libraries that documentation does not use.
      - name: Build docs
        run: cargo doc --no-deps --no-default-features --features threading,serialize
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Shellcheck scripts
        run: shellcheck scripts/ci/*.sh scripts/gate/*.sh

  # ─────────────────────────────────────────────────────────────────────────
  # Each feature compiles alone, so a feature that leans on another one's
  # import fails here. `--all-targets` also checks the tests each feature
  # enables. Add a row for every new non-debug feature.
  clippy:
    name: Clippy (${{ matrix.features || 'no features' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { features: "" }
          - { features: "threading" }
          - { features: "asm" }
          - { features: "serialize" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: clippy-${{ matrix.features }}

      - name: Install NASM
        if: matrix.features == 'asm'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm

      - name: Clippy
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo clippy --no-default-features --features "$FEATURES" --all-targets -- -D warnings

  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "no features", flags: "--no-default-features" }
          - { name: "default", flags: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: test-${{ matrix.name }}

      - name: Run tests
        env:
          FLAGS: ${{ matrix.flags }}
        run: cargo test $FLAGS --no-fail-fast

  # ─────────────────────────────────────────────────────────────────────────
  # The MSRV comes from `package.rust-version`, so the published contract and
  # this job cannot drift apart. It is read with grep: the toolchain `cargo
  # metadata` runs on is the one this job is choosing.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read MSRV from the manifest
        id: msrv
        run: |
          set -euo pipefail
          MSRV=$(grep -m1 '^rust-version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [[ -z "$MSRV" ]]; then
            echo "::error::rust-version is missing from Cargo.toml"
            exit 1
          fi
          echo "Declared MSRV: $MSRV"
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: msrv-${{ steps.msrv.outputs.version }}

      # Library target only. Dev-dependencies are not part of the contract.
      - name: Check MSRV
        run: cargo check --lib --no-default-features --features threading,serialize

  # ─────────────────────────────────────────────────────────────────────────
  # `--exclude-dev`: dev-dependencies link test oracles only.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny --exclude-dev check
